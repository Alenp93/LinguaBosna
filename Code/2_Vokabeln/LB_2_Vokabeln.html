<body>

  <!-- Header (dynamisch eingebunden per LB_main.js) -->

  <main>

    <!-- Section-Intro Block (Designvorgabe: jede Section verwendet diesen Block) -->

      <h1>Vokabeln</h1>
      <p>Wähle dein Sprachniveau und starte deine Lerneinheit</p>
    </div>

    <!-- ── Niveau-Auswahl (Tab-Buttons) ──────────────────────────
         Wird per JS mit den tatsächlich vorhandenen Niveaus befüllt. -->

    <!-- Lade-Meldung (wird per JS ausgeblendet) -->
    <p id="loadingMsg" class="loading-msg">
      <i class="fa-solid fa-spinner fa-spin"></i> Kategorien werden geladen…
    </p>

    <!-- Container für die Karten-Grids je Niveau (komplett per JS befüllt) -->
    <!-- Hinweis: Kapitel, die im Vokabeltrainer schon geübt wurden, bekommen
         nachträglich einen grünen Haken im Icon-Kreis. Das macht
         /Code/LB_fortschritt.js von außen (Klassen .lb-geuebt / .lb-haken,
         Styles in /Code/Style.css) – hier auf der Seite ist dafür kein Code
         nötig. Ohne gespeicherten Fortschritt ändert sich nichts. -->
    <div id="levelGrids"></div>

  </main>

  <!-- Footer (dynamisch eingebunden per LB_main.js) -->
  <div id="footer"></div>

  <script>
    // ── Pfade ────────────────────────────────────────────────────────
    // Diese Seite braucht nur Kapitelnummer, -name, Niveau und Anzahl je
    // Kapitel (97 Zeilen) — dafür reicht der schlanke kapitel_index.json
    // (siehe build_kapitel_index.py), statt der kompletten ~650-KB-Datei
    // mit allen ~2.900 Einzelvokabeln.
    const JSON_PATH   = "/Code/2_Vokabeln/kapitel_index.json";
    const MASTER_PAGE = '/Code/2_Vokabeln/LB_2-1_Vokabeln_Master.html';
    // ────────────────────────────────────────────────────────────────

    // Feste Reihenfolge & Beschriftung der Niveaus (wie auf der Grammatikseite)
    const LEVEL_ORDER  = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    const LEVEL_LABELS = {
      'A1': 'A1 – Grundlagen',
      'A2': 'A2 – Aufbau',
      'B1': 'B1 – Mittelstufe',
      'B2': 'B2 – Fortgeschritten',
      'C1': 'C1 – Oberstufe',
      'C2': 'C2 – Profi'
    };

    // ── Themen-Icons ────────────────────────────────────────────────
    // Statt fester Kapitelnummern wird das Icon anhand von Stichwörtern im
    // Kapitelnamen gewählt. Das bleibt auch dann korrekt, wenn sich
    // Kapitelnummern künftig verschieben oder neue Kapitel dazukommen.
    // Die Reihenfolge ist wichtig: spezifischere Begriffe stehen oben.
    const ICON_RULES = [
      // Hausbau-Kapitel zuerst: "Hausbau: …" würde sonst von der
      // allgemeinen Regel /haus|wohnen/ weiter unten abgefangen,
      // "Haustechnik" zusätzlich von /technik|internet/ und
      // "Traditionelle Baukultur" von /kultur/.
      [/fundament|mauerwerk/i,                 'fa-trowel-bricks'],
      [/dach|gebäudeteile/i,                   'fa-house-chimney'],
      [/werkzeug|baustelle/i,                  'fa-screwdriver-wrench'],
      [/handwerker|gewerke/i,                  'fa-helmet-safety'],
      [/einrichtung|möbel/i,                   'fa-couch'],
      // "haustechnik" muss vor "ausbau" stehen: in "H-ausbau-technik"
      // steckt die Zeichenfolge "ausbau" mit drin.
      [/haustechnik/i,                         'fa-plug'],
      [/ausbau|oberflächen/i,                  'fa-paint-roller'],
      [/grundstück|baugenehmigung/i,           'fa-map-location-dot'],
      [/bauvertrag|abrechnung/i,               'fa-file-invoice'],
      [/baukultur/i,                           'fa-mosque'],
      [/begrüßung|alltagssprache/i,            'fa-comments'],
      [/höflichkeit|anlässe/i,                 'fa-hand-holding-heart'],
      [/routine/i,                             'fa-arrows-rotate'],
      [/zahlen|mengen/i,                       'fa-hashtag'],
      [/farben|formen/i,                       'fa-palette'],
      [/körper/i,                              'fa-person'],
      [/familie|freunde/i,                     'fa-people-group'],
      [/verwandtschaft|lebensphasen/i,         'fa-children'],
      [/verben|handlungen/i,                   'fa-person-running'],
      // Funktionswörter: gleiches Icon wie "Regionalismen & Diskurspartikeln"
      // weiter unten – beide Kapitel liegen in verschiedenen Niveau-Tabs und
      // sind nie gleichzeitig sichtbar.
      [/adverbien/i,                           'fa-language'],
      [/obst|gemüse/i,                         'fa-apple-whole'],
      [/mahlzeiten|geschirr/i,                 'fa-plate-wheat'],
      [/küche/i,                               'fa-bowl-food'],
      [/essen|trinken/i,                       'fa-utensils'],
      // "feiertage" muss vor "religion" stehen, sonst bekämen beide
      // A2-Kapitel dasselbe Icon.
      [/feiertage|bräuche/i,                   'fa-gift'],
      // Bewusst fa-place-of-worship statt fa-mosque: das Kapitel ist
      // multikonfessionell (Imam, Franziskaner, Ikone, Rabbiner). fa-mosque
      // ist schon für "Traditionelle Baukultur" vergeben.
      [/religion|glaube/i,                     'fa-place-of-worship'],
      // "uhrzeit"/"jahreszeiten" vor der Datums-Regel: dort steht \bzeit\b,
      // was in "Uhrzeit" und "Jahreszeiten" gerade nicht greifen würde.
      [/uhrzeit|jahreszeiten/i,                'fa-clock'],
      [/\bzeit\b|datum/i,                      'fa-calendar-days'],
      // "Wohnen zur Miete" muss vor /haus|wohnen/ stehen, sonst bekommt es
      // dasselbe Icon wie das A1-Kapitel "Haus & Wohnen".
      [/miete|nebenkosten/i,                   'fa-key'],
      [/haus|wohnen/i,                         'fa-house'],
      [/kleidung|aussehen/i,                   'fa-shirt'],
      [/tiere/i,                               'fa-paw'],
      [/wetter/i,                              'fa-cloud-sun'],
      [/natur|länder/i,                        'fa-earth-europe'],
      // "verkehrsmittel" muss vor /reisen|verkehr/ stehen, sonst erbt das
      // Nahverkehrs-Kapitel das Flugzeug-Icon der Reise-Kapitel.
      [/verkehrsmittel/i,                      'fa-bus'],
      [/reisen|verkehr/i,                      'fa-plane'],
      [/stadt|wegbeschreibung/i,               'fa-map-location-dot'],
      [/einkaufen/i,                           'fa-cart-shopping'],
      [/hobbys|freizeit/i,                     'fa-futbol'],
      [/berufe|arbeit|karriere/i,              'fa-briefcase'],
      [/schule/i,                              'fa-school'],
      [/literatur/i,                           'fa-book-open'],
      [/studium|bildung/i,                     'fa-graduation-cap'],
      [/technik|internet/i,                    'fa-microchip'],
      [/medizin/i,                             'fa-stethoscope'],
      [/symptome/i,                            'fa-notes-medical'],
      [/gesundheit/i,                          'fa-heart-pulse'],
      [/persönlichkeit/i,                      'fa-fingerprint'],
      [/beziehungen/i,                         'fa-heart'],
      [/gefühle|emotion|haltung|charakter/i,   'fa-face-smile'],
      [/kommunikation/i,                       'fa-tower-broadcast'],
      [/öffentlichkeit/i,                      'fa-tv'],
      [/medien/i,                              'fa-newspaper'],
      [/meinung|diskussion/i,                  'fa-comment-dots'],
      [/konnektoren/i,                         'fa-link'],
      [/redemittel/i,                          'fa-comment-dots'],
      [/redewendungen|idiome|idiomatik/i,      'fa-quote-right'],
      [/orientalizmi|kulturlexik/i,            'fa-star-and-crescent'],
      [/sevdah|kulturerbe/i,                   'fa-music'],
      // "Versicherung, Steuer & Soziales" muss vor /gesellschaft|soziales/
      // stehen, sonst erbt es das Icon von "Gesellschaft & Soziales".
      [/versicherung|steuer/i,                 'fa-shield-halved'],
      [/gesellschaft|soziales/i,               'fa-people-roof'],
      [/kultur/i,                              'fa-masks-theater'],
      [/politik|staat/i,                       'fa-landmark-dome'],
      [/umwelt|klima/i,                        'fa-leaf'],
      // Ebenso "Bankgeschäfte & Finanzen" vor /wirtschaft|finanzen/.
      [/bankgeschäfte/i,                       'fa-building-columns'],
      [/wirtschaft|finanzen/i,                 'fa-chart-line'],
      [/geld/i,                                'fa-money-bill-wave'],
      [/wissenschaft|forschung/i,              'fa-flask'],
      [/synonyme|nuancen/i,                    'fa-arrow-right-arrow-left'],
      [/gehobene|lexik/i,                      'fa-feather-pointed'],
      [/abstrakte|konzepte|begriffe/i,         'fa-lightbulb'],
      [/kollokationen|wendungen/i,             'fa-puzzle-piece'],
      [/formell/i,                             'fa-file-signature'],
      [/anerkennung|papiere/i,                 'fa-stamp'],
      [/behörden/i,                            'fa-landmark'],
      [/justiz|verwaltung|recht|gericht/i,     'fa-gavel'],
      [/umgangssprache|bosnizismen/i,          'fa-comment'],
      [/sprichwörter|sprichwort/i,             'fa-quote-left'],
      [/archaismen|feierliche/i,               'fa-scroll'],
      [/regionalismen|dialekt|partikeln/i,     'fa-language']
    ];

    function iconFor(name) {
      for (const [regex, icon] of ICON_RULES) {
        if (regex.test(name)) return 'fa-solid ' + icon;
      }
      return 'fa-solid fa-book';   // Fallback
    }

    // ── Tab-Logik: nur das gewählte Niveau anzeigen ─────────────────
    // updateUrl=true schreibt das Niveau in die Adresszeile (?niveau=B2),
    // ohne einen neuen History-Eintrag zu erzeugen. Dadurch landet man auch
    // über den Browser-Zurück-Button wieder im richtigen Tab.
    function showLevel(level, updateUrl = true) {
      document.querySelectorAll('#levelGrids .vocab-grid').forEach(grid => {
        grid.classList.toggle('hidden', grid.dataset.level !== level);
      });
      document.querySelectorAll('.level-btn').forEach(btn => {
        const aktiv = btn.dataset.level === level;
        btn.classList.toggle('active', aktiv);
        btn.setAttribute('aria-selected', aktiv ? 'true' : 'false');
      });

      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set('niveau', level);
        history.replaceState(null, '', url);
      }
    }

    async function loadCategories() {
      try {
        const res = await fetch(JSON_PATH);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        // Gruppieren: Niveau → Kapitel → { name, count }
        // (Reihenfolge der Kapitel ergibt sich aus dem ersten Auftreten.)
        // kapitel_index.json enthält bereits genau ein Objekt pro Kapitel
        // (Einträge mit "nur_woerterbuch" hat build_kapitel_index.py schon
        // herausgefiltert), daher hier nur noch nach Niveau gruppieren.
        const byLevel = new Map();
        data.forEach(entry => {
          const niv = entry.Niveau;
          if (!byLevel.has(niv)) byLevel.set(niv, new Map());
          byLevel.get(niv).set(entry.Kapitel, {
            kapitel:     entry.Kapitel,
            kapitelname: entry.Kapitelname,
            count:       entry.Anzahl
          });
        });

        // Nur tatsächlich vorhandene Niveaus, in fester Reihenfolge
        const levels = LEVEL_ORDER.filter(l => byLevel.has(l));

        // Startniveau aus der URL lesen (?niveau=B2). Kommt man von einer
        // Kapitelseite über "Zurück zur Übersicht" zurück, ist das Niveau
        // dort angehängt – so öffnet wieder der passende Tab statt immer A1.
        // Unbekannte oder fehlende Werte fallen auf das erste Niveau zurück.
        const urlLevel   = (new URLSearchParams(window.location.search).get('niveau') || '').toUpperCase();
        const startLevel = levels.includes(urlLevel) ? urlLevel : levels[0];

        // 1) Tab-Buttons bauen
        const selector = document.getElementById('levelSelector');
        selector.innerHTML = '';
        levels.forEach(lvl => {
          const aktiv = lvl === startLevel;
          const btn = document.createElement('button');
          btn.className = 'level-btn' + (aktiv ? ' active' : '');
          btn.dataset.level = lvl;
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', aktiv ? 'true' : 'false');
          btn.textContent = LEVEL_LABELS[lvl] || lvl;
          btn.addEventListener('click', () => showLevel(lvl));
          selector.appendChild(btn);
        });

        // 2) Karten-Grids je Niveau bauen (Startniveau sichtbar, Rest versteckt)
        const gridsWrap = document.getElementById('levelGrids');
        gridsWrap.innerHTML = '';
        levels.forEach(lvl => {
          const grid = document.createElement('div');
          grid.className = 'vocab-grid' + (lvl === startLevel ? '' : ' hidden');
          grid.dataset.level = lvl;

          byLevel.get(lvl).forEach(({ kapitel, kapitelname, count }) => {
            const a = document.createElement('a');
            a.href      = `${MASTER_PAGE}?kapitel=${kapitel}`;
            a.className = 'vocab-card';
            a.setAttribute('aria-label', `Kapitel ${kapitel}: ${kapitelname}`);
            a.innerHTML = `
              <div class="vocab-card-icon">
                <i class="${iconFor(kapitelname)}" aria-hidden="true"></i>
              </div>
              <div class="vocab-card-num">Kapitel ${kapitel}</div>
              <h2 class="vocab-card-title">${kapitelname}</h2>
              <div class="vocab-card-count">${count} Vokabeln</div>
            `;
            grid.appendChild(a);
          });

          gridsWrap.appendChild(grid);
        });

        // Lade-Meldung ausblenden
        document.getElementById('loadingMsg').style.display = 'none';

      } catch (e) {
        const msg = document.getElementById('loadingMsg');
        msg.innerHTML = '⚠️ Kategorien konnten nicht geladen werden. Bitte prüfe den JSON-Pfad.';
        msg.style.color = '#b03030';
      }
    }

    loadCategories();
  </script>

</body>
